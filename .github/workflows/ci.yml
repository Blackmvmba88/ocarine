name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate BM-OC-002 physical gate logic
        run: python3 hardware/ocarina-acoustic-v2/analyze_physical_validation.py --self-test

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate instrument contract
        run: npm test

      - name: Type-check and build
        run: npm run build
